version: "3.8"

services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-joszomszedsag}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    expose:
      - 3306
    ports:
      - "${DB_EXPOSE_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped
    expose:
      - 6379
    volumes:
      - redis-data:/data

  # Application: built from docker/build (PHP 8.3, Laravel 12).
  app:
    build: docker/build
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - 80
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST:-joszomszedsag.local}
      DB_HOST: mysql
      REDIS_HOST: redis
    volumes:
      - .:/var/www

  # One-shot test runner (PHP 8.3 + pcov): docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    profiles: ["test"]
    volumes:
      - .:/app
    working_dir: /app
    command: ["vendor/bin/phpunit", "--coverage-text"]

volumes:
  mysql-data:
  redis-data:
