name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, pdo_mysql, pdo_sqlite, gd, pcov
          coverage: pcov
      - run: composer validate --no-check-lock
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: find app routes database -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit --coverage-text
      - name: enforce 50% line coverage
        run: |
          COV=$(vendor/bin/phpunit --coverage-text 2>/dev/null | grep -oP 'Lines:\s+\K[0-9.]+(?=%)')
          echo "Line coverage: ${COV}%"
          python3 -c "import sys; sys.exit(0 if float('${COV}') >= 50 else 1)" || (echo "::error::coverage ${COV}% < 50%" && exit 1)

  node:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
